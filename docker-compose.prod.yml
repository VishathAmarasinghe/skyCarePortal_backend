# Production stack (branch main). Default DB: skycareportal_prod (override with SPRING_DATASOURCE_URL).
# Uses Compose default network (no external network). Host nginx reaches services via published ports only.
services:
  frontend-production:
    container_name: frontend-production
    image: frontend:production
    ports:
      - "127.0.0.1:8081:80"
    restart: always

  backend-production:
    container_name: backend-production
    image: backend:production
    ports:
      - "127.0.0.1:5001:5000"
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://139.99.236.174:3306/skycareportal_prod}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SERVER_PORT=5000
      - FRONTEND_URL=https://skycare.au
    volumes:
      - /var/lib/skycare_production/skycareuploads:/root/skyCareUploads
