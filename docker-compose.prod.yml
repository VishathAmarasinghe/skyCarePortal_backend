services:
  frontend-production:
    container_name: frontend-production
    image: frontend:latest
    ports:
      - "8081:80" 
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    environment:
      - FRONTEND_URL=http://frontend:80
      - VITE_BACKEND_BASE_URL=https://skycare.au/api
      - VITE_APPLICATION_ADMIN=admin.skyCarePortal
      - VITE_APPLICATION_SUPER_ADMIN=superadmin.skyCarePortal
      - VITE_APPLICATION_CARE_GIVER=caregiver.skyCarePortal
      - VITE_FILE_DOWNLOAD_PATH=/file/download

  backend-production:
    container_name: backend-production
    image: backend:latest
    ports:
      - "5001:5000"
    networks:
      - app-network
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://139.99.236.174:3306/skycareportal_prod}
      - SPRING_DATASOURCE_USERNAME=produser
      - SPRING_DATASOURCE_PASSWORD=skycareProd123!
      - SPRING_MAIL_USERNAME=no-reply@skycaresolutions.com.au
      - SPRING_MAIL_PASSWORD=Skycare@3977
      - SERVER_PORT=5000
      - FRONTEND_URL=https://skycare.au
    volumes:
      - /var/lib/skycare_production/skycareuploads:/root/skyCareUploads

  reverse-proxy:
    container_name: reverse-proxy
    image: proxy:latest
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
    restart: always

networks:
  app-network:
    external: true
