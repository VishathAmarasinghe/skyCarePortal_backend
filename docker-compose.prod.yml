# Production stack (branch main). Default DB: skycareportal_prod (override with SPRING_DATASOURCE_URL).
services:
  frontend-production:
    container_name: frontend-production
    image: frontend:production
    ports:
      - "127.0.0.1:8081:80"
    restart: always

  backend-production:
    container_name: backend-production
    image: backend:production
    depends_on:
      pdf-service-production:
        condition: service_healthy
    ports:
      - "127.0.0.1:5001:5000"
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://139.99.236.174:3306/skycareportal_prod}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SERVER_PORT=5000
      - FRONTEND_URL=${FRONTEND_URL:-https://skycare.au}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-https://skycare.au/api}
      - PDF_SERVICE_URL=http://pdf-service-production:3001
    volumes:
      - /var/lib/skycare_production/skycareuploads:/root/skyCareUploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/training-course-types >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  pdf-service-production:
    container_name: pdf-service-production
    image: pdf-service:production
    ports:
      - "127.0.0.1:3002:3001"
    restart: always
    environment:
      - PORT=3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
