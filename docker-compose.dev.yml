version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_BASE_URL: "http://backend:5000"
        VITE_APPLICATION_ADMIN: "admin.skyCarePortal"
        VITE_APPLICATION_SUPER_ADMIN: "superadmin.skyCarePortal"
        VITE_APPLICATION_CARE_GIVER: "caregiver.skyCarePortal"
        VITE_FILE_DOWNLOAD_PATH: "/file/download"
    ports:
      - "80:80"  # Expose frontend on port 80
    networks:
      - app-network
    environment:
      - FRONTEND_URL=http://frontend:80

  backend:
    build:
      context: ./backend
      args:
        SPRING_PROFILES_ACTIVE: "dev"
        SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/skycareportal_dev"
        SPRING_DATASOURCE_USERNAME: "root"
        SPRING_DATASOURCE_PASSWORD: "root"
        SPRING_MAIL_USERNAME: "projectvishath@gmail.com"
        SPRING_MAIL_PASSWORD: "ovdi uiox jqvd avai"
        FRONTEND_URL: "http://frontend:80"
        SERVER_PORT: 5000
    depends_on:
      - mysql
    ports:
      - "5000:5000"  # Expose backend on port 5000
    networks:
      - app-network

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "skycareportal_dev"
    volumes:
      - mysql-data-dev:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
