services:
  frontend-staging:
    container_name: frontend-staging
    image: frontend:latest
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    environment:
      - FRONTEND_URL=http://frontend:80
      - VITE_BACKEND_BASE_URL=https://stg.skycare.au/api
      - VITE_APPLICATION_ADMIN=admin.skyCarePortal
      - VITE_APPLICATION_SUPER_ADMIN=superadmin.skyCarePortal
      - VITE_APPLICATION_CARE_GIVER=caregiver.skyCarePortal
      - VITE_FILE_DOWNLOAD_PATH=/file/download

  backend-staging:
    container_name: backend-staging
    image: backend:latest
    ports:
      - "5000:5000"
    networks:
      - app-network
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://139.99.236.174:3306/skycareportal_dev}
      - SPRING_DATASOURCE_USERNAME=devuser
      - SPRING_DATASOURCE_PASSWORD=skycaredev
      - SPRING_MAIL_USERNAME=projectvishath@gmail.com
      - SPRING_MAIL_PASSWORD=ovdi uiox jqvd avai
      - SERVER_PORT=5000

  reverse-proxy:
    container_name: reverse-proxy
    image: proxy:latest
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
    restart: always

networks:
  app-network:
    driver: bridge
