# Staging stack (branch dev). Default DB: skycareportal_staging (override with SPRING_DATASOURCE_URL).
# Uses Compose default network (no external network). Host nginx reaches services via published ports only.
services:
  frontend-staging:
    container_name: frontend-staging
    image: frontend:staging
    ports:
      - "127.0.0.1:8082:80"
    restart: always

  backend-staging:
    container_name: backend-staging
    image: backend:staging
    ports:
      - "127.0.0.1:5002:5000"
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://139.99.236.174:3306/skycareportal_staging}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SERVER_PORT=5000
      - FRONTEND_URL=https://stg.skycare.au
    volumes:
      - /var/lib/skycareuploads:/root/skyCareUploads
