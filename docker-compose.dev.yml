# Staging stack (branch dev). Default DB: skycareportal_staging (override with SPRING_DATASOURCE_URL).
# Backend includes staff training, behavior support, compliance lookups, agreements, etc.
# Host nginx reaches services via published ports only.
services:
  frontend-staging:
    container_name: frontend-staging
    image: frontend:staging
    ports:
      - "127.0.0.1:8082:80"
    restart: always

  backend-staging:
    container_name: backend-staging
    image: backend:staging
    depends_on:
      pdf-service-staging:
        condition: service_healthy
    ports:
      - "127.0.0.1:5002:5000"
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://139.99.236.174:3306/skycareportal_staging}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SERVER_PORT=5000
      - FRONTEND_URL=${FRONTEND_URL:-https://stg.skycare.au}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-https://stg.skycare.au/api}
      - PDF_SERVICE_URL=http://pdf-service-staging:3001
    volumes:
      - /var/lib/skycareuploads:/root/skyCareUploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/training-course-types >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  pdf-service-staging:
    container_name: pdf-service-staging
    image: pdf-service:staging
    ports:
      - "127.0.0.1:3001:3001"
    restart: always
    environment:
      - PORT=3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
