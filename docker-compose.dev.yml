services:
  frontend-staging:
    container_name: frontend-staging
    image: frontend:latest
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - FRONTEND_URL=http://frontend:80
      - VITE_BACKEND_BASE_URL=http://backend-staging:5000
      - VITE_APPLICATION_ADMIN=admin.skyCarePortal
      - VITE_APPLICATION_SUPER_ADMIN=superadmin.skyCarePortal
      - VITE_APPLICATION_CARE_GIVER=caregiver.skyCarePortal
      - VITE_FILE_DOWNLOAD_PATH=/file/download

  backend-staging:
    container_name: backend-staging
    image: backend:latest
    depends_on:
      - mysql
    ports:
      - "5000:5000"
    networks:
      - app-network
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/skycareportal_dev}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_MAIL_USERNAME=projectvishath@gmail.com
      - SPRING_MAIL_PASSWORD=ovdi uiox jqvd avai
      - SERVER_PORT=5000

  mysql:
    container_name: database-staging
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "skycareportal_dev"
    volumes:
      - mysql-data-dev:/var/lib/mysql
    networks:
      - app-network

  reverse-proxy:
    container_name: reverse-proxy
    image: proxy:latest
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data-dev:
