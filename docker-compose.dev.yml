version: '3.8'

services:
  frontend:
    image: frontend:latest
    ports:
      - "80:80"  # Expose frontend on port 80
    networks:
      - app-network
    environment:
      - FRONTEND_URL=http://frontend:80

  backend:
    image: backend:latest:latest
    depends_on:
      - mysql
    ports:
      - "5000:5000"  # Expose backend on port 5000
    networks:
      - app-network

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "skycareportal_dev"
    volumes:
      - mysql-data-dev:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
