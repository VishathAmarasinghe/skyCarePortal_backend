# All environment-specific and secret values come from the environment (docker-compose, Jenkins, or local exports).
# Do not add default fallbacks here for URLs, credentials, or ports.

spring.application.name=skyCarePortal

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Email Configuration
spring.mail.host=mail.skycaresolutions.com.au
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@skycaresolutions.com.au}
spring.mail.password=${SPRING_MAIL_PASSWORD:Skycare@3977}

# SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=mail.skycaresolutions.com.au

# External Frontend URL
app.external.service.frontendUrl=${FRONTEND_URL:https://skycare.au/}
app.external.service.baseUrl=${BACKEND_BASE_URL:http://localhost:5000}

# Agreement module
agreement.reminder.days-after-sent=3
agreement.reminder.max-count=3
agreement.reminder.cron=0 0 9 * * ?
agreement.asset-cleanup.cron=0 0 3 * * SUN
agreement.public.rate-limit-per-minute=30
agreement.public.require-email-verification=false

# Server Port Configuration
server.port=${SERVER_PORT:5000}
