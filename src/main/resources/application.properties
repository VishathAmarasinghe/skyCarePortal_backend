# Spring Boot application.properties for environment-specific configurations

# Application Name
spring.application.name=skyCarePortal

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/skycareportal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:projectvishath@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ovdi uiox jqvd avai}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# External Frontend URL
app.external.service.frontendUrl=${FRONTEND_URL:http://localhost:5173/}

# Server Port Configuration
server.port=${SERVER_PORT:5000}
