# Spring Boot application.properties for environment-specific configurations

# Application Name
spring.application.name=skyCarePortal

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://139.99.236.174:3306/skycareportal_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:skycaredev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration
spring.mail.host=mail.skycaresolutions.com.au
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@skycaresolutions.com.au}
spring.mail.password=${SPRING_MAIL_PASSWORD:Skycare@3977}

# SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=mail.skycaresolutions.com.au

# External Frontend URL
app.external.service.frontendUrl=${FRONTEND_URL:https://skycare.au/}

# Server Port Configuration
server.port=${SERVER_PORT:5000}
